# Deploys apps/api to a free Hugging Face Docker Space (the $0 primary host, ADR-0009; setup in docs/deploy.md).
#
# The Space repository is a build artifact: deploy/hf-space/assemble.sh writes the Space card (README.md with
# `sdk: docker`, `app_port: 8787`), a root Dockerfile (= apps/api/Dockerfile) and the workspace files that
# /.dockerignore lets into the image; this job builds that directory with Docker (nothing is pushed if the image does
# not build), then force-pushes it to the Space as one commit. Hugging Face then builds and starts the container.
#
# Needs: secret HF_TOKEN (a Hugging Face token with write access to the Space) and variable HF_SPACE
# (<owner>/<space>, e.g. jayasinghthakur/merchantbridge-api). Without either, the job posts a notice and succeeds.
# Optional variable WEB_URL: the Vercel production URL, linked from the Space card.
#
# Migrations are not run here (no secrets for the database live in GitHub): apply them with
# apps/api/scripts/migrate.ts before merging a change that adds one (docs/deploy.md).
name: Deploy API (Hugging Face Space)

on:
  push:
    branches: [main]
    # Everything that can change the Space: the image inputs (see /.dockerignore), the card and assembly script,
    # and this workflow.
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.dockerignore'
      - 'deploy/hf-space/**'
      - '.github/workflows/deploy-hf-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  deploy:
    name: assemble, build, push to the Space
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      # Secrets cannot be used in `if:` directly, so the first step turns "is everything set?" into an output.
      - name: Check deploy settings
        id: gate
        shell: bash
        run: |
          if [ -z "${HF_TOKEN}" ] || [ -z "${HF_SPACE}" ]; then
            echo "::notice title=Space deploy skipped::Set the HF_TOKEN secret and the HF_SPACE variable (<owner>/<space>) to deploy apps/api to a Hugging Face Space (docs/deploy.md). Nothing was deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "${HF_SPACE}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::HF_SPACE must be <owner>/<space>, e.g. jayasinghthakur/merchantbridge-api (got '${HF_SPACE}')."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.deploy == 'true'
        with:
          persist-credentials: false

      - name: Assemble the Space repository
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          bash deploy/hf-space/assemble.sh "$RUNNER_TEMP/hf-space"
          (cd "$RUNNER_TEMP/hf-space" && find . -type f -not -path './.git/*' | sort)

      # The same build Hugging Face will run (root Dockerfile, Space root as the context). A broken image fails here,
      # before the Space is touched. The boot smoke test of this Dockerfile lives in ci.yml (job "docker").
      - name: Build the Space image (no push)
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build -t merchantbridge-space:check "$RUNNER_TEMP/hf-space"
          # Hugging Face runs Space containers as uid 1000.
          test "$(docker run --rm merchantbridge-space:check id -u)" = "1000"

      # One commit, force-pushed: the Space history is disposable and every deploy replaces it completely.
      # The token reaches git only through the credential helper's environment, never in a URL, argv or the log.
      - name: Push to the Space (force)
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          cd "$RUNNER_TEMP/hf-space"
          git init -q -b main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q \
            -m "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA::12}" \
            -m "Generated by .github/workflows/deploy-hf-space.yml from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}. Do not edit this Space directly: the next deploy force-pushes over it."
          git -c credential.helper= \
            -c credential.helper='!f() { test "$1" = get || exit 0; echo "username=${HF_SPACE%%/*}"; echo "password=${HF_TOKEN}"; }; f' \
            push --force --quiet "https://huggingface.co/spaces/${HF_SPACE}" HEAD:main

      - name: Summary
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          {
            echo "### Pushed apps/api to the Hugging Face Space"
            echo ""
            echo "- Space: https://huggingface.co/spaces/${HF_SPACE} (build and container logs: the Space's **Logs** button)"
            echo "- Source commit: \`${GITHUB_SHA::12}\`"
            echo "- Hugging Face now builds the image and restarts the container; the first build takes several minutes."
            echo "- Then check \`<API>/health/ready\` (docs/deploy.md, \"Verify production\")."
          } >> "$GITHUB_STEP_SUMMARY"
