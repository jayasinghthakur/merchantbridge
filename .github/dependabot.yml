version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Matches pnpm's minimum release age: let fresh releases settle before proposing them.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(deps)
    ignore:
      # Types must match the Node runtime (24 LTS); bump together with .nvmrc and the Dockerfile base image.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript < 6.1; bump TypeScript only together with it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # MCP SDK v2 packages are exact-pinned and must move together (one compatibility check per bump).
      mcp-sdk:
        patterns:
          - '@modelcontextprotocol/*'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns:
          - '*'
