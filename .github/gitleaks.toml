# gitleaks config for .github/workflows/ci.yml (GITLEAKS_CONFIG). Extends the built-in rules.
title = "merchantbridge"

[extend]
useDefault = true

[[allowlists]]
description = "Vendored third-party API docs: Zoho's pages contain non-functional example client secrets and tokens."
paths = ['''(^|/)docs/vendor/''']

[[allowlists]]
description = "Demo fault ids (DEMO_FAULTS in packages/core/src/telemetry.ts) listed after 'expired_token' look like a key/value pair."
targetRules = ["generic-api-key"]
regexes = ['''^(rate_limit_44|expired_token|daily_quota_45|concurrency_1070|server_5xx|malformed)$''']

[[allowlists]]
description = "Placeholder API keys in tests and docs (mb_live_TESTKEY, mb_live_YOUR_KEY): not real credentials."
targetRules = ["curl-auth-header", "generic-api-key"]
regexTarget = "match"
regexes = ['''mb_live_(TESTKEY|YOUR_KEY)\b''']

[[allowlists]]
description = "LLM model ids (e.g. llama-3.3-70b-versatile) and the fixed fake key the injection eval plants to prove leak detection."
targetRules = ["generic-api-key"]
regexes = ['''^(llama-[0-9.]+-[0-9]+b-[a-z]+|gsk_AbCdEf1234567890)$''']
